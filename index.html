<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Chat</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
            height: 100vh;
            overflow-y: auto;
            padding: 15px;
        }
        #terminal { display: flex; flex-direction: column; gap: 4px; }
        .line { line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
        .system-msg { color: #aaaaaa; }
        .error-msg { color: #ff5555; }
        .success-msg { color: #55ff55; }
        #input-line { display: flex; align-items: center; margin-top: 4px; }
        #prompt { color: #ffffff; white-space: pre; user-select: none; }
        #cmd-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #ffffff; font-family: Consolas, "Courier New", monospace;
            font-size: 15px; padding-left: 5px;
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div class="line system-msg">==================================================</div>
        <div class="line system-msg"> Welcome to Terminal Chat v1.0 (Live Online)</div>
        <div class="line system-msg"> Type /help for a list of available commands.</div>
        <div class="line system-msg">==================================================</div>
        
        <div id="input-line">
            <span id="prompt">&lt;newuser&gt;&nbsp;&nbsp;</span>
            <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        // --- YOUR SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://mjgwdhehcoezqpphjssi.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_fSXmk1cQ1wynHyM3_gQcLw_3QU3SiNY";

        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- APPLICATION STATE ---
        let currentUser = localStorage.getItem('chat_currentUser') || null;
        let currentRoom = null;
        let joinedRooms = [];
        let pendingAction = null;
        let activeSubscription = null;

        // --- DOM ELEMENTS ---
        const terminal = document.getElementById('terminal');
        const inputLine = document.getElementById('input-line');
        const promptEl = document.getElementById('prompt');
        const inputEl = document.getElementById('cmd-input');

        document.body.addEventListener('click', () => inputEl.focus());

        // Initialize session on load
        async function initSession() {
            if (currentUser) {
                const { data: memberships } = await dbClient.from('room_members').select('roomname').eq('username', currentUser);
                joinedRooms = memberships ? memberships.map(m => m.roomname) : [];
                printLine(`Auto-logged in as session user: ${currentUser}`, "success-msg");
            }
            updatePrompt();
        }
        initSession();

        function updatePrompt() {
            if (pendingAction) {
                promptEl.textContent = "confirm>  ";
            } else if (!currentUser) {
                promptEl.textContent = "<newuser>  ";
            } else if (currentRoom) {
                promptEl.textContent = `<${currentUser}\\${currentRoom}>  `;
            } else {
                promptEl.textContent = `<${currentUser}>  `;
            }
        }

        function printLine(text, className = '') {
            const line = document.createElement('div');
            line.className = `line ${className}`;
            line.textContent = text;
            terminal.insertBefore(line, inputLine);
            window.scrollTo(0, document.body.scrollHeight);
        }

        inputEl.addEventListener('keydown', async function (e) {
            if (e.key === 'Enter') {
                const inputVal = this.value.trim();
                this.value = '';
                if (!inputVal) return;

                printLine(`${promptEl.textContent}${inputVal}`);

                if (pendingAction) {
                    if (inputVal.toLowerCase() === '/confirm') {
                        await executePendingAction();
                    } else {
                        printLine("Action cancelled.", "system-msg");
                        pendingAction = null;
                        updatePrompt();
                    }
                    return;
                }

                if (inputVal.startsWith('/')) {
                    await handleCommand(inputVal);
                } else {
                    await handleChatMessage(inputVal);
                }
            }
        });

        async function handleCommand(rawInput) {
            const parts = rawInput.split(' ');
            const command = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (!currentUser && command !== '/login' && command !== '/signup' && command !== '/help') {
                printLine("Please use /login or /signup first", "error-msg");
                return;
            }

            switch (command) {
                case '/signup': {
                    if (args.length < 2) return printLine("Usage: /signup [username] [password]", "error-msg");
                    const [username, password] = args;

                    const { data: existing } = await dbClient.from('users').select('username').eq('username', username).single();
                    if (existing) return printLine("Username already exists.", "error-msg");

                    const { error } = await dbClient.from('users').insert([{ username, password }]);
                    if (error) return printLine("Error creating account.", "error-msg");

                    currentUser = username;
                    localStorage.setItem('chat_currentUser', currentUser);
                    joinedRooms = [];
                    updatePrompt();
                    printLine(`Account created! Logged in as ${currentUser}`, "success-msg");
                    break;
                }

                case '/login': {
                    if (args.length < 2) return printLine("Usage: /login [username] [password]", "error-msg");
                    const [username, password] = args;

                    const { data: user } = await dbClient.from('users').select('*').eq('username', username).eq('password', password).single();
                    if (!user) return printLine("Invalid username or password.", "error-msg");

                    currentUser = username;
                    localStorage.setItem('chat_currentUser', currentUser);
                    
                    const { data: memberships } = await dbClient.from('room_members').select('roomname').eq('username', currentUser);
                    joinedRooms = memberships ? memberships.map(m => m.roomname) : [];
                    currentRoom = null;
                    updatePrompt();
                    printLine(`Logged in successfully as ${currentUser}`, "success-msg");
                    break;
                }

                case '/logout': {
                    currentUser = null;
                    currentRoom = null;
                    joinedRooms = [];
                    localStorage.removeItem('chat_currentUser');
                    if (activeSubscription) dbClient.removeChannel(activeSubscription);
                    updatePrompt();
                    printLine("Logged out successfully and session data cleared.", "system-msg");
                    break;
                }

                case '/cls':
                case '/clear': {
                    const lines = terminal.querySelectorAll('.line');
                    lines.forEach(l => l.remove());
                    break;
                }

                case '/create': {
                    if (args.length < 2) return printLine("Usage: /create [roomname] [roomcode]", "error-msg");
                    const [roomname, roomcode] = args;

                    const { data: existing } = await dbClient.from('rooms').select('roomname').eq('roomname', roomname).single();
                    if (existing) return printLine("Room name already exists.", "error-msg");

                    await dbClient.from('rooms').insert([{ roomname, roomcode }]);
                    await dbClient.from('room_members').insert([{ username: currentUser, roomname }]);

                    joinedRooms.push(roomname);
                    printLine(`Room '${roomname}' created and joined successfully!`, "success-msg");
                    break;
                }

                case '/join': {
                    if (args.length < 2) return printLine("Usage: /join [roomname] [roomcode]", "error-msg");
                    const [roomname, roomcode] = args;

                    const { data: room } = await dbClient.from('rooms').select('*').eq('roomname', roomname).single();
                    if (!room) return printLine("Room does not exist.", "error-msg");
                    if (room.roomcode !== roomcode) return printLine("Incorrect roomcode.", "error-msg");

                    pendingAction = { type: 'join', room: roomname };
                    updatePrompt();
                    printLine(`Are you sure you want to join '${roomname}'? Type /confirm to proceed (or anything else to cancel).`, "system-msg");
                    break;
                }

                case '/enter': {
                    if (args.length < 1) return printLine("Usage: /enter [roomname]", "error-msg");
                    const targetRoom = args[0];

                    if (!joinedRooms.includes(targetRoom)) return printLine("You are not a member of this room, join by /join", "error-msg");

                    currentRoom = targetRoom;
                    updatePrompt();
                    printLine(`Entered room '${currentRoom}'. Loading chat history...`, "success-msg");

                    const { data: history } = await dbClient
                        .from('messages')
                        .select('*')
                        .eq('roomname', currentRoom)
                        .order('created_at', { ascending: true });

                    if (history) {
                        history.forEach(msg => {
                            if (msg.sender !== currentUser) {
                                printLine(`<${msg.sender}\\${currentRoom}>  ${msg.content}`);
                            }
                        });
                    }

                    if (activeSubscription) dbClient.removeChannel(activeSubscription);

                    activeSubscription = dbClient
                        .channel('public:messages')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                            const newMsg = payload.new;
                            if (newMsg.roomname === currentRoom && newMsg.sender !== currentUser) {
                                printLine(`<${newMsg.sender}\\${currentRoom}>  ${newMsg.content}`);
                            }
                        })
                        .subscribe();
                    break;
                }

                case '/exit': {
                    if (!currentRoom) return printLine("You are not currently in any room.", "error-msg");
                    printLine(`Exited room '${currentRoom}'.`, "system-msg");
                    if (activeSubscription) dbClient.removeChannel(activeSubscription);
                    currentRoom = null;
                    updatePrompt();
                    break;
                }

                case '/leave': {
                    if (!currentRoom) return printLine("You are not currently in any room to leave.", "error-msg");
                    pendingAction = { type: 'leave', room: currentRoom };
                    updatePrompt();
                    printLine(`Are you sure you want to leave '${currentRoom}' permanently? Type /confirm to proceed (or anything else to cancel).`, "system-msg");
                    break;
                }

                case '/view': {
                    if (joinedRooms.length === 0) {
                        printLine("You have not joined any rooms yet.", "system-msg");
                    } else {
                        printLine("Rooms you have joined:", "system-msg");
                        joinedRooms.forEach(r => printLine(` - ${r}`));
                    }
                    break;
                }

                case '/help': {
                    printLine("--- Available Commands ---", "system-msg");
                    printLine(" /signup [username] [password]  : Create an account");
                    printLine(" /login [username] [password]   : Log in to your account");
                    printLine(" /logout                        : Log out and clear saved info");
                    printLine(" /cls or /clear                 : Clear terminal screen");
                    printLine(" /create [roomname] [roomcode]  : Create a room");
                    printLine(" /join [roomname] [roomcode]    : Join a room (requires confirmation)");
                    printLine(" /enter [roomname]             : Enter a joined room");
                    printLine(" /exit                         : Exit current room");
                    printLine(" /leave                        : Leave current room permanently (requires confirmation)");
                    printLine(" /view                         : Show joined rooms");
                    printLine(" /help                         : Show this menu");
                    break;
                }

                default:
                    printLine(`Unknown command '${command}'. Type /help for options.`, "error-msg");
            }
        }

        async function executePendingAction() {
            const action = pendingAction;
            pendingAction = null;

            if (action.type === 'join') {
                await dbClient.from('room_members').upsert([{ username: currentUser, roomname: action.room }]);
                if (!joinedRooms.includes(action.room)) joinedRooms.push(action.room);
                printLine(`Successfully joined '${action.room}'! Use /enter ${action.room} to open it.`, "success-msg");
            } else if (action.type === 'leave') {
                await dbClient.from('room_members').delete().eq('username', currentUser).eq('roomname', action.room);
                joinedRooms = joinedRooms.filter(r => r !== action.room);
                if (activeSubscription) dbClient.removeChannel(activeSubscription);
                currentRoom = null;
                printLine(`You have permanently left '${action.room}'.`, "system-msg");
            }
            updatePrompt();
        }

        async function handleChatMessage(message) {
            if (!currentUser) return printLine("Please use /login or /signup first", "error-msg");
            if (!currentRoom) return printLine("You are not in a room yet, enter one with /enter", "error-msg");

            await dbClient.from('messages').insert([{ roomname: currentRoom, sender: currentUser, content: message }]);
        }
    </script>
</body>
</html>
